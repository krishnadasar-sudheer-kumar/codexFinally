services:
  finally:
    build:
      context: .
      dockerfile: Dockerfile
    image: finally:local
    container_name: finally
    env_file:
      - .env
    environment:
      DB_PATH: /app/db/finally.db
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - finally-data:/app/db
    restart: unless-stopped

volumes:
  finally-data:
